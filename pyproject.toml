[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "m30-self-calibrating-maf"
version = "0.1.0"
description = "Identifiability-aware, lambda-guided calibration of a physics-informed virtual airflow sensor (BMW M30B35 virtual case study, Article 1 simulation study)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Alaa A. ALdhalemi" }]
keywords = [
    "virtual sensor",
    "mass air flow",
    "speed-density",
    "residual learning",
    "system identification",
    "Fisher information",
    "recursive least squares",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "physics_model",
    "virtual_engine",
    "sensor_models",
    "fuel_lambda_path",
    "generate_dataset",
    "prepare_splits",
    "train_pure_ai",
    "train_residual_ai",
    "scalar_fisher_gate",
    "calibration_gate",
    "online_calibration",
    "classical_rls",
    "uncertainty",
    "legacy_output",
    "evaluate",
    "statistical_analysis",
    "make_publication_figures",
    "run_pipeline",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
